version: "3.8"

services:
  db:
    container_name: db
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME}
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - MYSQL_USER=${WORDPRESS_DB_USER}
    image: mariadb
    volumes:
      - ./data:/var/lib/mysql:Z
    ports:
      - "3307:3306"
    networks:
      - kg
  wp:
    container_name: wp
    depends_on:
      - db
    build: ./wordpress
    volumes:
      - ./wordpress/app/public/.htaccess:/var/www/html/.htaccess
      - ./wordpress/app/public/wp-content/themes/:/var/www/html/wp-content/themes/
      - ./wordpress/app/public/wp-content/plugins/:/var/www/html/wp-content/plugins/
      - ./wordpress/app/public/wp-content/uploads/:/var/www/html/wp-content/uploads/
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    ports:
      - "8080:80"
    expose:
      - "8080"
    environment:
      - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME}
    networks:
      - kg
  phpma:
    container_name: phpma
    depends_on:
      - db
    image: phpmyadmin:latest
    environment:
      - PMA_HOST=${WORDPRESS_DB_HOST}
      - PMA_USER=${WORDPRESS_DB_USER}
      - PMA_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - PHP_UPLOAD_MAX_FILESIZE=600M
      - UPLOAD_LIMIT=600M
      - PHP_MAX_INPUT_VARS=1
    ports:
      - "8001:80"
    networks:
      - kg
  node:
    command: npm run dev
    container_name: node
    build:
      context: ./frontend
      dockerfile: Dockerfile.node
    ports:
      - "8081:5173"
    volumes:
      - ./frontend:/home/node/app:Z
      # - ./frontend/src:/home/node/app/src:Z
      # - ./frontend/package.json:/home/node/app/packasge.json
      # - ./frontend/.env.development:/home/node/app/.env.development
      # - ./frontend/.env.production:/home/node/app/.env.production
      # - ./frontend/.eslintrc.json:/home/node/app/.eslintrc:Z
    working_dir: /home/node/app
    networks:
      - kg
  # storybook:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.storybook
  #   container_name: sb
  #   init: true
  #   ports:
  #     - 6006:6006
  #   volumes:
  #     - ./frontend/:/usr/src/app
  #     - /usr/src/app/node_modules


volumes:
  data: {}
  wordpress: {}

networks:
  kg:
